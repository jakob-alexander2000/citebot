name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Fixtures and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Fixture tests
        run: npm run test:ci

      - name: CiteBot eval harness
        run: npm run eval

      - name: Build
        run: npm run build

  handbook-evals:
    name: citebot-evals fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CiteBot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: citebot
          persist-credentials: false

      - name: Checkout citebot-evals
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jakob-alexander2000/citebot-evals
          path: citebot-evals
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: citebot-evals/package-lock.json

      - name: Install evals
        working-directory: citebot-evals
        run: npm ci

      - name: Fixture scorecard
        working-directory: citebot-evals
        run: npm run eval
